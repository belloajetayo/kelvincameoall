<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Bevel & Lighting Gradients -->
    <linearGradient id="blue3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d5fa0" />
      <stop offset="40%" stop-color="#0e3d74" />
      <stop offset="100%" stop-color="#072244" />
    </linearGradient>

    <linearGradient id="orange3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7626" />
      <stop offset="40%" stop-color="#f25c05" />
      <stop offset="100%" stop-color="#b83800" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a3568" />
      <stop offset="50%" stop-color="#1e68b3" />
      <stop offset="100%" stop-color="#0b386e" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#071b33" flood-opacity="0.22" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- RC Number -->
  <text x="475" y="42" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="16" fill="#0c2e56" text-anchor="end" letter-spacing="1">RC: 1613032</text>

  <!-- Outer Frame (Square with Open Accent Gap) -->
  <g filter="url(#dropShadow)">
    <!-- Top & Left Frame Bar -->
    <path d="M 135 60 L 355 60 L 355 72 L 147 72 L 147 285 L 135 285 Z" fill="url(#orange3d)" />
    <!-- Bottom & Right Frame Bar -->
    <path d="M 147 285 L 343 285 L 343 273 L 355 273 L 355 297 L 135 297 Z" fill="url(#orange3d)" />
    <path d="M 343 72 L 355 72 L 355 273 L 343 273 Z" fill="url(#orange3d)" />
  </g>

  <!-- KC Monogram -->
  <g filter="url(#dropShadow)">
    <!-- Letter K (Royal Blue 3D) -->
    <!-- Vertical Spine -->
    <rect x="165" y="90" width="40" height="175" rx="2" fill="url(#blue3d)" />
    <!-- Top Diagonal Arm -->
    <polygon points="205,185 270,90 315,90 235,200" fill="url(#blue3d)" />
    <!-- Bottom Diagonal Leg -->
    <polygon points="220,175 295,265 255,265 195,195" fill="url(#blue3d)" />

    <!-- Letter C (Vibrant Orange 3D - Interlocking) -->
    <path d="M 315 160 
             C 295 130, 240 135, 235 180 
             C 230 225, 285 255, 325 240 
             L 335 265 
             C 275 290, 195 245, 205 175 
             C 215 110, 305 100, 345 140 Z" fill="url(#orange3d)" />
  </g>

  <!-- Brand Typography -->
  <g filter="url(#subtleShadow)">
    <!-- KELVIN -->
    <text x="35" y="360" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#0a3568" letter-spacing="2.5">KELVIN</text>
    
    <!-- CAME -->
    <text x="215" y="360" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#0a3568" letter-spacing="2.5">CAME</text>

    <!-- O with Palm Tree Inside -->
    <g transform="translate(425, 342)">
      <!-- Circle of O -->
      <circle cx="22" cy="-4" r="21" fill="none" stroke="#0a3568" stroke-width="12" />
      <!-- Palm Tree Silhouette -->
      <path d="M 22 14 Q 21 0, 23 -14" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <!-- Palm Fronds -->
      <path d="M 23 -14 Q 10 -22, 5 -12" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" />
      <path d="M 23 -14 Q 14 -27, 21 -26" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" />
      <path d="M 23 -14 Q 32 -27, 25 -26" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" />
      <path d="M 23 -14 Q 36 -22, 40 -12" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" />
      <!-- Island Base -->
      <path d="M 12 12 Q 22 8, 32 12" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
    </g>
  </g>

  <!-- Flowing Ocean Wave Graphic -->
  <path d="M 35 385 Q 115 375, 175 390 T 240 375" fill="none" stroke="url(#waveGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- RESORT -->
  <text x="265" y="405" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="38" fill="url(#orange3d)" letter-spacing="4">RESORT</text>

  <!-- Tagline Enclosure -->
  <line x1="40" y1="432" x2="95" y2="432" stroke="url(#orange3d)" stroke-width="3" stroke-linecap="round" />
  
  <text x="108" y="437" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="14.5" fill="#0a3568" letter-spacing="3.5">RELAX</text>
  <circle cx="178" cy="433" r="3.5" fill="url(#orange3d)" />
  
  <text x="190" y="437" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="14.5" fill="#0a3568" letter-spacing="3.5">RECHARGE</text>
  <circle cx="295" cy="433" r="3.5" fill="url(#orange3d)" />
  
  <text x="308" y="437" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="14.5" fill="#0a3568" letter-spacing="3.5">RECONNECT</text>
  
  <line x1="422" y1="432" x2="465" y2="432" stroke="url(#orange3d)" stroke-width="3" stroke-linecap="round" />
</svg>
