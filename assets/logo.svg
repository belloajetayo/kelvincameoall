<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Sky Blue Vibrant Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Warm Amber Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Clean Crisp Inner Glow -->
    <radialGradient id="softGlow" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Rounded Emblem Shield -->
  <rect x="20" y="20" width="360" height="360" rx="84" fill="url(#skyGrad)" stroke="#bae6fd" stroke-width="6" />
  <rect x="20" y="20" width="360" height="360" rx="84" fill="url(#softGlow)" />

  <!-- Gold Orbital Ring -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-dasharray="16 8" opacity="0.85" />

  <!-- Stylized Geometric "K" and "C" Vector Mark -->
  <g transform="translate(4, 0)">
    <!-- Letter K (Vertical Pillar & Energy Wing) -->
    <path d="M125 105 H155 V295 H125 Z" fill="#ffffff" />
    <!-- K Upper Arm (Gold Gradient Flame) -->
    <path d="M155 195 L225 105 H265 L185 205 Z" fill="url(#goldGrad)" />
    <!-- K Lower Arm (Sky Cyan Pillar) -->
    <path d="M175 190 L260 295 H220 L155 215 Z" fill="#bae6fd" />

    <!-- Letter C (Dynamic Crest Arc) -->
    <path d="M260 140 C240 115 205 105 170 105 C115 105 80 150 80 200 C80 250 115 295 170 295 C205 295 240 285 260 260 L240 240 C225 258 200 265 170 265 C130 265 110 232 110 200 C110 168 130 135 170 135 C200 135 225 142 240 160 Z" fill="#ffffff" opacity="0.25" />
  </g>

  <!-- Four Strategic Division Stars -->
  <circle cx="200" cy="56" r="6" fill="#f59e0b" />
  <circle cx="344" cy="200" r="6" fill="#f59e0b" />
  <circle cx="200" cy="344" r="6" fill="#f59e0b" />
  <circle cx="56" cy="200" r="6" fill="#f59e0b" />
</svg>
